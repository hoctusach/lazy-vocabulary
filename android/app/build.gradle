apply plugin: 'com.android.application'

// Release signing: put keystore.properties (storeFile, storePassword, keyAlias, keyPassword)
// in android/ — it is gitignored, never commit it. See ANDROID.md.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

// Signing inputs: env LAZYVOCA_UPLOAD_* first, then keystore.properties. Neither -> unsigned release.
def envOrProp = { String envName, String propName ->
    def v = System.getenv(envName)
    (v != null && !v.isEmpty()) ? v : keystoreProps[propName]
}
def releaseStoreFileRaw = envOrProp('LAZYVOCA_UPLOAD_STORE_FILE', 'storeFile')
def releaseStorePassword = envOrProp('LAZYVOCA_UPLOAD_STORE_PASSWORD', 'storePassword')
def releaseKeyAlias = envOrProp('LAZYVOCA_UPLOAD_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = envOrProp('LAZYVOCA_UPLOAD_KEY_PASSWORD', 'keyPassword')
// Env paths: absolute or relative to android/; keystore.properties paths are relative to android/.
def releaseStoreFile = releaseStoreFileRaw ? rootProject.file(releaseStoreFileRaw) : null
def releaseSigningConfigured = releaseStoreFile != null && releaseStoreFile.exists() &&
    releaseStorePassword && releaseKeyAlias && releaseKeyPassword
if (!releaseSigningConfigured) {
    logger.lifecycle("[signing] No release keystore configured (env LAZYVOCA_UPLOAD_* or android/keystore.properties): release output will be UNSIGNED.")
}

android {
    namespace "com.lazy.vocabulary"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hoctusach.lazyvocabulary"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Override with -PversionCode=12 -PversionName=1.2.0 (the release workflow does).
        versionCode = ((project.findProperty("versionCode") ?: "1") as String).toInteger()
        versionName = (project.findProperty("versionName") ?: "1.0.0") as String
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // sherpa-onnx ships no 32-bit x86 build we want to carry (saves ~10 MB).
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningConfigured) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // admob_app_id (string resource used by the manifest) is generated by generateAdmobIds (see below).
    sourceSets.main.res.srcDirs += "${buildDir}/generated/res/admob"
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // sherpa-onnx (Kokoro on-device TTS): fetched + sha256-verified by the downloadSherpaAar task below. Not committed.
    implementation files('libs-sherpa/sherpa-onnx-static-link-onnxruntime-2.0.2.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20' // the sherpa-onnx AAR is written in Kotlin
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// ---- AdMob: single source of truth is src/config/ads.ts --------------------------------------
// App id precedence: env ADMOB_APP_ID / -PadmobAppId, then VITE_ADMOB_APP_ID= in root .env.production / .env, then Google's test id.
def ADMOB_TEST_APP_ID = "ca-app-pub-3940256099942544~3347511713"
def resolveAdmobAppId = {
    def fromEnv = System.getenv("ADMOB_APP_ID") ?: project.findProperty("admobAppId")
    if (fromEnv) return fromEnv.toString().trim()
    for (name in [".env.production", ".env"]) {
        def f = rootProject.file("../${name}")
        if (!f.exists()) continue
        def m = (f.getText("UTF-8") =~ /(?m)^\s*VITE_ADMOB_APP_ID\s*=\s*["']?([^"'\s#]+)/)
        if (m.find()) return m.group(1)
    }
    return ADMOB_TEST_APP_ID
}
def usesTestAds = { resolveAdmobAppId().contains("3940256099942544") }
def admobXml = file("${buildDir}/generated/res/admob/values/admob_ids.xml")
tasks.register("generateAdmobIds") {
    inputs.property("admobAppId", { resolveAdmobAppId() })
    outputs.file(admobXml)
    doLast {
        def id = resolveAdmobAppId().replace("&", "&amp;").replace("<", "&lt;")
        admobXml.parentFile.mkdirs()
        admobXml.text = """<?xml version="1.0" encoding="utf-8"?>
<resources>
    <!-- Generated by generateAdmobIds (env/.env/test id). Do not edit. -->
    <string name="admob_app_id" translatable="false">${id}</string>
</resources>
"""
    }
}
afterEvaluate {
    tasks.matching { it.name == "preBuild" || it.name ==~ /merge.*Resources/ || it.name ==~ /process.*Resources/ || it.name ==~ /lint.*/ }.configureEach {
        dependsOn("generateAdmobIds")
    }
    // Debug builds may use Google's sample IDs. A release build must not.
    tasks.matching { it.name == "preReleaseBuild" }.configureEach {
        doFirst {
            if (usesTestAds()) {
                def allow = (System.getenv("ALLOW_TEST_ADS") ?: project.findProperty("allowTestAds") ?: "").toString() == "true"
                if (!allow) {
                    throw new GradleException("Release build would use Google sample AdMob IDs (3940256099942544). Set ADMOB_APP_ID / VITE_ADMOB_APP_ID (and VITE_ADMOB_BANNER_ID) to real IDs, or set ALLOW_TEST_ADS=true (or -PallowTestAds=true) to build anyway. Debug builds may keep the test IDs.")
                }
                logger.warn("\n!!! WARNING: RELEASE BUILD USES GOOGLE TEST ADMOB IDs (ALLOW_TEST_ADS=true). DO NOT PUBLISH TO PRODUCTION WITH THESE. !!!\n")
            }
        }
    }
}

// Debug APKs are sideloaded for testing: compress native libs (sherpa-onnx ~70 MB raw for 3 ABIs -> ~28 MB).
// Release/AAB keeps the default (uncompressed, page-aligned); Play splits per ABI and compresses the download.
androidComponents {
    onVariants(selector().withBuildType("debug")) { variant ->
        variant.packaging.jniLibs.useLegacyPackaging.set(true)
    }
}

// ---- sherpa-onnx AAR (not committed): download once, verify sha256, fail the build on mismatch ----
def SHERPA_AAR_NAME = "sherpa-onnx-static-link-onnxruntime-2.0.2.aar"
def SHERPA_AAR_URL = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.2/${SHERPA_AAR_NAME}"
def SHERPA_AAR_SHA256 = "cb73564809268c8b96bf98f1a32b0b3b611e01d028d22f10beb57ef55418c0cb"
def sherpaAar = file("libs-sherpa/${SHERPA_AAR_NAME}")
def sha256Of = { File f ->
    def md = java.security.MessageDigest.getInstance("SHA-256")
    f.withInputStream { is ->
        byte[] buf = new byte[1 << 16]
        int n
        while ((n = is.read(buf)) > 0) md.update(buf, 0, n)
    }
    md.digest().collect { String.format("%02x", it) }.join()
}
tasks.register("downloadSherpaAar") {
    outputs.file(sherpaAar)
    doLast {
        if (!sherpaAar.exists()) {
            sherpaAar.parentFile.mkdirs()
            def tmp = new File(sherpaAar.parentFile, SHERPA_AAR_NAME + ".part")
            logger.lifecycle("Downloading ${SHERPA_AAR_URL} ...")
            new URL(SHERPA_AAR_URL).openStream().withCloseable { is -> tmp.withOutputStream { os -> os << is } }
            if (!tmp.renameTo(sherpaAar)) throw new GradleException("Could not move ${tmp} to ${sherpaAar}")
        }
        def actual = sha256Of(sherpaAar)
        if (actual != SHERPA_AAR_SHA256) {
            sherpaAar.delete()
            throw new GradleException("sherpa-onnx AAR sha256 mismatch: expected ${SHERPA_AAR_SHA256}, got ${actual}. The file was deleted.")
        }
    }
}
tasks.matching { it.name == "preBuild" }.configureEach { dependsOn("downloadSherpaAar") }

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
