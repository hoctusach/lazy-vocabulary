# Codemagic CI for Lazy Vocabulary iOS (no Mac needed). See IOS_PLAN.md for the exact one-time setup.
# NO secrets in this file: certificates/profiles/API keys live in Codemagic (Teams > Personal account >
# Integrations / Code signing identities) and are only referenced here by NAME.
workflows:
  ios-simulator:
    name: iOS simulator build + Swift tests + unsigned IPA (no signing)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
    triggering:
      events: [pull_request]
      branch_patterns:
        - pattern: 'feat/ios*'
          include: true
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Fetch + verify sherpa-onnx (pinned url + sha256; Package.swift pins the same zip)
        script: scripts/ios/fetch-sherpa-onnx.sh
      - name: Build web bundle (capacitor-www, never docs/) and sync
        script: |
          VITE_ENABLE_PRO=true npm run build:mobile
          npx cap sync ios
      - name: Swift unit tests (G2P parity, post-FX, model status)
        script: |
          cd ios/App/KokoroTtsKit
          xcodebuild test -scheme KokoroTtsKit -destination 'platform=iOS Simulator,id=$(scripts/ios/pick-sim.sh iPhone)' CODE_SIGNING_ALLOWED=NO
      - name: Unsigned simulator build
        script: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Unsigned device archive -> LazyVocabulary-unsigned.ipa (sideload with Sideloadly)
        script: |
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p build/ipa/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/ipa/Payload/App.app
          (cd build/ipa && zip -qry ../LazyVocabulary-unsigned.ipa Payload)
    artifacts:
      - build/LazyVocabulary-unsigned.ipa
      - build/ios/Build/Products/Debug-iphonesimulator/App.app

