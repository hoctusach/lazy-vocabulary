name: iOS TestFlight (signed) - DISABLED until secrets exist

# Ready but inert: manual only (workflow_dispatch), and every real step is skipped unless ALL required secrets are present
# AND you type "yes" in the `confirm` input. Needs a paid Apple Developer Program membership ($99/yr).
# See IOS_KOKORO_SETUP.md ("TestFlight route") for how to create the secrets. Secrets are NEVER committed; they are only read
# here through `secrets.*`.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   APP_STORE_CONNECT_KEY_ID        key id of the App Store Connect API key (role: Admin or App Manager)
#   APP_STORE_CONNECT_ISSUER_ID     issuer id (App Store Connect > Users and Access > Integrations)
#   APP_STORE_CONNECT_PRIVATE_KEY   full contents of the downloaded AuthKey_XXXX.p8 file
#   APPLE_TEAM_ID                   10-character team id (developer.apple.com > Membership)
# Optional: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_ADMOB_IOS_APP_ID, VITE_ADMOB_IOS_BANNER_ID (same as codemagic.yaml).
# Signing uses Xcode automatic signing with the API key (-allowProvisioningUpdates): Xcode creates / downloads the Apple
# Distribution certificate and App Store profile in the cloud, so no .p12 or fastlane match repo is needed. (If you prefer manual
# certificates, import a .p12 into a temporary keychain here instead and drop -allowProvisioningUpdates.)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to build, sign and upload to TestFlight'
        required: true
        default: 'no'

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.c.outputs.enabled }}
    steps:
      - id: c
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
          K1: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          K2: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          K3: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          K4: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$CONFIRM" = "yes" ] && [ -n "$K1" ] && [ -n "$K2" ] && [ -n "$K3" ] && [ -n "$K4" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "TestFlight upload is disabled (missing secrets or confirm != yes). Nothing was built."
          fi

  testflight:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: macos-15
    timeout-minutes: 75
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_ADMOB_IOS_APP_ID: ${{ secrets.VITE_ADMOB_IOS_APP_ID }}
      VITE_ADMOB_IOS_BANNER_ID: ${{ secrets.VITE_ADMOB_IOS_BANNER_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_P8: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: scripts/ios/fetch-sherpa-onnx.sh
      - name: Build web bundle (Pro enabled, capacitor-www, never docs/)
        run: VITE_ENABLE_PRO=true npm run build:mobile
      - run: npx cap sync ios
      - name: Real AdMob iOS app id (only if provided)
        run: |
          if [ -n "${VITE_ADMOB_IOS_APP_ID:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier $VITE_ADMOB_IOS_APP_ID" ios/App/App/Info.plist
          else
            echo "WARNING: building with Google TEST AdMob ids"
          fi
      - name: Write the API key to a temp file (never logged)
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${KEY_ID}.p8"
      - name: Build number = run number
        run: cd ios/App && agvtool new-version -all "${{ github.run_number }}"
      - name: Archive (automatic signing through the API key)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            | tail -n 40
      - name: Export + upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" | tail -n 30
      - name: Remove the key file
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
