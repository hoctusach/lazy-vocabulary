name: iOS build, tests and unsigned IPA

# macOS runner, manual (workflow_dispatch) + PRs touching iOS-relevant paths. NO certificates, NO secrets.
#  1. Swift unit tests (G2P parity, post-FX, model status) on the iOS Simulator
#  2. Release archive of the app WITH the Kokoro plugin -> unsigned LazyVocabulary-unsigned.ipa (sideload with Sideloadly)
#  3. Debug simulator build + smoke test (boots iPhone, launches the app, screenshot must not be blank)
# Signed TestFlight uploads live in ios-testflight.yml (disabled until secrets exist) and codemagic.yaml.
on:
  pull_request:
    paths:
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/ios/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios.yml'
      - 'codemagic.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    name: Swift unit tests (simulator)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (Capacitor 8 binaries need Swift 6.2)
        run: scripts/ios/select-xcode.sh
      - name: Fetch + verify sherpa-onnx (pinned url + sha256, same as Package.swift)
        run: scripts/ios/fetch-sherpa-onnx.sh
      - name: Run KokoroTtsKit tests on the iOS Simulator
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/build"
          cd ios/App/KokoroTtsKit
          xcodebuild -list || true
          xcodebuild test \
            -scheme KokoroTtsKit \
            -destination "platform=iOS Simulator,id=$("$GITHUB_WORKSPACE/scripts/ios/pick-sim.sh" iPhone)" \
            -resultBundlePath "$GITHUB_WORKSPACE/build/swift-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$GITHUB_WORKSPACE/build/swift-tests.log" | tail -n 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-test-results
          path: |
            build/swift-tests.xcresult
            build/swift-tests.log
          if-no-files-found: ignore

  build-ipa:
    name: Unsigned IPA (Release, device)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (Capacitor 8 binaries need Swift 6.2)
        run: scripts/ios/select-xcode.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch + verify sherpa-onnx
        run: scripts/ios/fetch-sherpa-onnx.sh
      # Web bundle goes to the gitignored capacitor-www/ (never docs/, the live website: FB-28). build:mobile also runs `cap sync`.
      - name: Build web bundle for the native shell (Pro enabled)
        run: VITE_ENABLE_PRO=true npm run build:mobile
      - name: Sync Capacitor iOS (existing ios/ project, never `cap add`)
        run: npx cap sync ios
      - name: Archive (unsigned) with the Kokoro plugin
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/archive.log | tail -n 60
      - name: Package Payload/App.app into LazyVocabulary-unsigned.ipa
        run: |
          APP=build/App.xcarchive/Products/Applications/App.app
          test -d "$APP"
          echo "--- frameworks inside the app:"; ls "$APP/Frameworks" || true
          test -d "$APP/Frameworks/SherpaOnnxC.framework" || { echo "SherpaOnnxC.framework is not embedded"; exit 1; }
          ls "$APP/public" | head -5
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/App.app
          (cd build/ipa && zip -qry ../LazyVocabulary-unsigned.ipa Payload)
          ls -lh build/LazyVocabulary-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: LazyVocabulary-unsigned-ipa
          path: build/LazyVocabulary-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-log
          path: build/archive.log
          if-no-files-found: ignore

  simulator-smoke:
    name: Simulator build + smoke test
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (Capacitor 8 binaries need Swift 6.2)
        run: scripts/ios/select-xcode.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: scripts/ios/fetch-sherpa-onnx.sh
      - name: Build web bundle for the native shell (Pro enabled)
        run: VITE_ENABLE_PRO=true npm run build:mobile
      - run: npx cap sync ios
      - name: Build simulator app (iPhone + iPad, unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log | tail -n 40
      - uses: actions/upload-artifact@v4
        with:
          name: LazyVocabulary-simulator-app
          path: build/ios/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
      # Boots an iPhone and an iPad, launches the app, and fails when the WebView stays blank (white/solid splash screen).
      - name: Simulator smoke test (WebView boots, no blank screen)
        run: |
          set -u
          APP=build/ios/Build/Products/Debug-iphonesimulator/App.app
          mkdir -p build/shots
          FAIL=0
          for DEV in iPhone iPad; do
            UDID=$(scripts/ios/pick-sim.sh "$DEV" || true)
            [ -n "$UDID" ] || { echo "no $DEV simulator"; FAIL=1; continue; }
            echo "== $DEV $UDID"
            SHOT="build/shots/$DEV.png"
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl launch "$UDID" com.hoctusach.lazyvocabulary
            sleep 25
            xcrun simctl io "$UDID" screenshot "$SHOT"
            xcrun simctl spawn "$UDID" launchctl list | grep -q UIKitApplication:com.hoctusach.lazyvocabulary || { echo "$DEV: app is not running (crashed?)"; FAIL=1; }
            if swift scripts/ios/png-stats.swift "$SHOT"; then echo "$DEV: UI rendered"; else echo "$DEV: BLANK SCREEN"; FAIL=1; fi
            xcrun simctl shutdown "$UDID"
          done
          exit $FAIL
      # [FB-74] Reminder "Play" action smoke (non-blocking). simctl cannot tap a notification action button, so this only
      # proves: the build launches, a push carrying the reminder category (`lv-reminder`) is accepted without crashing the
      # app, and the app is still running afterwards. The real Play tap (opens the app, starts today's playback) is a
      # manual TestFlight/real-device check, see tests/regression/USER_FEEDBACK.md (FB-74).
      - name: Reminder Play action smoke (iPhone simulator)
        continue-on-error: true
        run: |
          APP=build/ios/Build/Products/Debug-iphonesimulator/App.app
          mkdir -p build/shots
          UDID=$(xcrun simctl list devices available | grep -F "iPhone 16 Pro" | head -1 | grep -oE '[0-9A-F-]{36}')
          [ -n "$UDID" ] || { echo "no iPhone simulator"; exit 0; }
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant notifications com.hoctusach.lazyvocabulary || true
          xcrun simctl launch "$UDID" com.hoctusach.lazyvocabulary
          sleep 8
          cat > build/reminder.apns <<'JSON'
          {"Simulator Target Bundle":"com.hoctusach.lazyvocabulary","aps":{"alert":{"title":"Lazy Vocabulary","body":"2 minutes of words?"},"category":"lv-reminder"},"lvReminder":true}
          JSON
          xcrun simctl push "$UDID" com.hoctusach.lazyvocabulary build/reminder.apns || true
          sleep 4
          xcrun simctl io "$UDID" screenshot build/shots/reminder_play_smoke.png
          xcrun simctl spawn "$UDID" launchctl list | grep -q com.hoctusach.lazyvocabulary
          xcrun simctl shutdown "$UDID" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: build/shots
          if-no-files-found: ignore
